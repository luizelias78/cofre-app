name: Compilar app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependências
        run: npm ci
      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Cofre-apk
          path: android/app/build/outputs/apk/release/*.apk

  ios:
    name: IPA iPhone (sem assinatura, para Sideloadly)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Gerar projeto iOS
        run: npx expo prebuild --platform ios
      - name: Compilar
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Empacotar .ipa
        run: |
          APP=$(ls -d ios/build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr Cofre-sem-assinatura.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Cofre-ipa
          path: Cofre-sem-assinatura.ipa
